site_name: Project Līlāvatī
site_description: An Open-Source Audited & Verifiable Agentic Stack & Benchmark for Institutional Finance
site_author: Project Līlāvatī Contributors
site_url: https://github.com/revendrat/lilavati
repo_url: https://github.com/revendrat/lilavati
repo_name: revendrat/lilavati

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture & Runtime: architecture.md
  - Tutorials & Developer Guide:
      - "01. Credit Workflow: Covenants, Merton PD & API": tutorials/01_build_your_first_financial_agent.md
      - "02. Statistical Arbitrage & Execution, Checked": tutorials/02_statistical_arbitrage_and_execution_agent.md
      - "03. Forensic Screens & Bull/Bear Committee": tutorials/03_forensic_accounting_and_adversarial_committee.md
      - "04. Climate Risk in a Portfolio": tutorials/04_climate_risk_and_sustainable_portfolio.md
      - "05. Benchmarking LLMs with Free & Open Models": tutorials/05_benchmarking_llms_with_open_models.md
      - "06. Analysing, Publishing & Citing Results": tutorials/06_analysing_and_publishing_results.md
      - "07. Tools versus Mental Math": tutorials/07_tools_versus_mental_math.md
  - "Course: AI in Finance": course/index.md
  - Using the MCP Servers: mcp-setup.md
  - Integrations (LangGraph, ADK, A2A): integrations.md
  - Numerical Validation:
      - Overview: validation/index.md
      - Fixed Income: validation/fixed_income.md
      - Derivatives: validation/derivatives.md
      - Invariants: validation/invariants.md
      - Sustainability: validation/sustainability.md
      - Forensics: validation/forensics.md
      - Econometrics: validation/econometrics.md
      - Financial ML: validation/financial_ml.md
  - Līlāvatī-Bench: benchmarks.md
  - Academic Pre-Prints:
      - "Framework Paper (Pre-Print 1)": papers/01_framework_paper.md
      - "Benchmark Paper (Pre-Print 2)": papers/02_benchmark_paper.md
  - Release notes:
      - "0.2.0 (alpha)": releases/v0.2.0.md
  - Contributing: contributing.md

